<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;height:100%;background:#fff;font-family:Inter,sans-serif">
  <sc-if value="{{ isPopup }}" hint-placeholder-val="{{ false }}">
    <div style="flex-shrink:0;padding:18px 12px 6px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span style="font-size:20px;font-weight:700;color:#25282A;white-space:nowrap">Ask LabGenie</span>
      <button onClick="{{ onClose }}" aria-label="Close chat" title="Close chat" style="flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;border-radius:10px;color:#25282A" style-hover="background:#F0F7FA" style-focus="outline:3px solid #9CCBEB;outline-offset:2px">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  </sc-if>
  <sc-if value="{{ notPopup }}" hint-placeholder-val="{{ true }}">
  <div style="flex-shrink:0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #DAE0EE;min-height:56px">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;width:36px;height:36px;background:#EBF5FA;border:1.5px solid #B8DBF0">
        <img src="logo-icon.png" alt="" width="26" height="26" style="display:block;width:26px;height:26px;object-fit:contain">
      </div>
      <span style="font-size:18px;font-weight:700;color:#25282A;white-space:nowrap">Ask LabGenie</span>
    </div>
    <sc-if value="{{ showChooseInHeader }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ chooseAnother }}" style="background:none;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;margin-left:auto;font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--accent,#016ab3)" style-hover="opacity:0.7">Choose another topic →</button>
    </sc-if>
    <sc-if value="{{ showClose }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onClose }}" aria-label="Close chat" title="Close chat" style="flex-shrink:0;margin-left:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid #C7D9EC;cursor:pointer;border-radius:10px;color:#25282A" style-hover="background:#F0F7FA;border-color:var(--accent,#016ab3)" style-focus="outline:3px solid #9CCBEB;outline-offset:2px">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </sc-if>
  </div>
  </sc-if>
  <sc-if value="{{ showChooseBelow }}" hint-placeholder-val="{{ false }}">
    <div style="flex-shrink:0;padding:0 24px">
      <button onClick="{{ chooseAnother }}" style="display:flex;align-items:center;gap:6px;min-height:44px;background:none;border:none;padding:0;cursor:pointer;font-family:Inter,sans-serif;font-size:15px;font-weight:600;color:var(--accent,#016ab3)" style-hover="opacity:0.7">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        Choose another topic
      </button>
    </div>
  </sc-if>

  <!-- Content -->
  <div data-chat-content style="flex:1;overflow-y:auto;padding:{{ contentPad }};min-height:0">

    <!-- DEFAULT -->
    <sc-if value="{{ isPopupDefault }}" hint-placeholder-val="{{ false }}">
      <div style="border-radius:16px;padding:16px 18px;margin-bottom:16px;background:#EEF2F7">
        <p style="margin:0;font-size:17px;font-weight:500;color:#25282A;line-height:26px">{{ greeting }}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <sc-for list="{{ chipButtons }}" as="chip" hint-placeholder-count="3">
          <button onClick="{{ chip.onClick }}" style="width:100%;text-align:left;border-radius:14px;padding:16px 18px;background:#fff;border:1.5px solid #DAE0EE;cursor:pointer;font-family:Inter,sans-serif;font-size:17px;font-weight:500;color:#25282A;line-height:26px" style-hover="background:#F0F7FA;border-color:#B8DBF0" style-focus="outline:3px solid #9CCBEB;outline-offset:2px">{{ chip.text }}</button>
        </sc-for>
      </div>
      <p style="margin:14px 0 0;font-size:15px;font-weight:500;color:#6B7280;line-height:22px">{{ hint }}</p>
    </sc-if>
    <sc-if value="{{ isPanelDefault }}" hint-placeholder-val="{{ true }}">
      <div style="border-radius:12px;padding:16px;margin-bottom:20px;background:#F2F5F8">
        <p style="font-size:15px;font-weight:500;color:#1A1A1A;line-height:22px">{{ greeting }}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ chipButtons }}" as="chip" hint-placeholder-count="4">
          <button onClick="{{ chip.onClick }}" style="width:100%;text-align:left;border-radius:12px;padding:12px 16px;background:#fff;border:1px solid #D6E8F2;cursor:pointer;font-family:Inter,sans-serif;font-size:15px;font-weight:500;color:#25282A;line-height:22px;transition:background .15s,border-color .15s" style-hover="background:#F0F7FA;border-color:#B8DBF0">{{ chip.text }}</button>
        </sc-for>
      </div>
      <p style="text-align:center;margin-top:16px;font-size:13px;font-weight:500;color:#9CA3AF">{{ hint }}</p>
    </sc-if>

    <!-- CHIP / FOLLOWUP -->
    <sc-if value="{{ notDefault }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;border-radius:12px;padding:12px 16px;margin-bottom:12px;background:var(--accent,#016ab3)">
        <span style="font-size:15px;font-weight:500;color:#fff;line-height:22px">{{ activeChipText }}</span>
      </div>
      <div style="border-radius:12px;padding:16px;margin-bottom:16px;background:#F2F5F8">
        <p style="font-size:15px;font-weight:500;color:#1A1A1A;line-height:22px">{{ activeResponse }}</p>
      </div>

      <sc-if value="{{ modeQuestions }}" hint-placeholder-val="{{ false }}">
        <p style="margin-bottom:8px;font-size:13px;font-weight:500;color:#9CA3AF">Tap the bookmark to save a question for your visit:</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ questionRows }}" as="q" hint-placeholder-count="3">
            <div style="{{ q.rowStyle }}" style-hover="{{ q.rowHover }}">
              <span style="flex:1;font-size:15px;font-weight:500;color:#25282A;line-height:22px">{{ q.text }}</span>
              <button onClick="{{ q.toggle }}" style="display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 12px;border-radius:10px;background:#F0F7FA;border:none;cursor:pointer;flex-shrink:0;font-family:Inter,sans-serif;font-size:15px;font-weight:700;color:var(--accent,#016ab3)" style-hover="background:#DCEEF8">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="{{ q.bmFill }}" stroke="var(--accent,#016ab3)" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                <span>{{ q.saveLabel }}</span>
              </button>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{ savedAny }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:14px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#EBF5FA;border:1px solid #B8DBF0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--accent,#016ab3)" stroke="var(--accent,#016ab3)" stroke-width="1.5" style="flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
            <span style="flex:1;font-size:14px;font-weight:600;color:#25282A">{{ savedLabel }}</span>
            <button onClick="{{ onViewPrep }}" style="background:none;border:none;padding:0;cursor:pointer;font-size:14px;font-weight:700;color:var(--accent,#016ab3);white-space:nowrap" style-hover="opacity:0.7">View prep list →</button>
          </div>
        </sc-if>
      </sc-if>

      <sc-if value="{{ modeChip }}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{ showRelatedLabel }}" hint-placeholder-val="{{ false }}">
          <p style="margin-bottom:8px;font-size:13px;font-weight:500;color:#9CA3AF">Related questions:</p>
        </sc-if>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ followupButtons }}" as="fu" hint-placeholder-count="3">
            <button onClick="{{ fu.onClick }}" style="width:100%;text-align:left;border-radius:12px;padding:12px 16px;background:#EBF5FA;border:1px solid #B8DBF0;cursor:pointer;font-family:Inter,sans-serif;font-size:15px;font-weight:500;color:var(--accent,#016ab3);line-height:22px" style-hover="opacity:0.8">{{ fu.text }}</button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ hasFollowup }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;border-radius:12px;padding:12px 16px;margin-bottom:12px;background:var(--accent,#016ab3)">
          <span style="font-size:15px;font-weight:500;color:#fff;line-height:22px">{{ followupText }}</span>
        </div>
        <div style="border-radius:12px;padding:16px;background:#F2F5F8">
          <p style="font-size:15px;font-weight:500;color:#1A1A1A;line-height:22px">{{ followupResponse }}</p>
          <p style="margin-top:12px;font-size:15px;font-weight:500;color:#1A1A1A;line-height:22px;font-style:italic">{{ followupHandoff }}</p>
        </div>
        <button onClick="{{ backToRelated }}" style="display:block;margin-top:12px;background:none;border:none;padding:0;cursor:pointer;font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--accent,#016ab3)" style-hover="opacity:0.7">← Back to related questions</button>
      </sc-if>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:560},&quot;chips&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;text&quot;:&quot;Can you help me understand my results?&quot;,&quot;response&quot;:&quot;Which results would you like me to explain?&quot;,&quot;showRelatedLabel&quot;:true,&quot;followups&quot;:[{&quot;text&quot;:&quot;TSH&quot;,&quot;response&quot;:&quot;Your TSH result of 7.0 mIU/L is higher than the normal range.&quot;,&quot;handoff&quot;:&quot;Your care team will be able to go into more detail at your next visit.&quot;}]}],&quot;tsType&quot;:&quot;any[]&quot;},&quot;questions&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;any[]&quot;},&quot;onViewPrep&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;greeting&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;closeable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { mode: 'default', chipIdx: 0, followupIdx: 0 };

  renderVals() {
    const chips = this.props.chips || [];
    const { mode, chipIdx, followupIdx } = this.state;
    const isDefault = mode === 'default';
    const activeChip = !isDefault ? chips[chipIdx] : null;
    const activeFollowup =
      mode === 'followup' && activeChip ? (activeChip.followups || [])[followupIdx] : null;

    const savedQCount = (this.props.questions || []).filter((q) => q && q.saved).length;
    return {
      greeting: this.props.greeting || "Hi, Sam. I'm LabGenie, your lab results companion. How can I help you today?",
      hint: this.props.hint || 'Select a topic above to learn more about your results.',
      isDefault,
      isPopup: !!this.props.closeable,
      notPopup: !this.props.closeable,
      isPopupDefault: isDefault && !!this.props.closeable,
      isPanelDefault: isDefault && !this.props.closeable,
      contentPad: this.props.closeable ? '12px 24px 24px' : '20px 16px',
      notDefault: !isDefault,
      showClose: !!this.props.closeable,
      showChooseAnother: !isDefault,
      showChooseInHeader: !isDefault && !this.props.closeable,
      showChooseBelow: !isDefault && !!this.props.closeable,
      chipButtons: isDefault
        ? chips.map((c, i) => ({ text: c.text, onClick: () => this.setState({ mode: 'chip', chipIdx: i }) }))
        : [],
      activeChipText: activeChip ? activeChip.text : '',
      activeResponse: activeChip ? activeChip.response : '',
      modeChip: mode === 'chip' && !(activeChip && activeChip.kind === 'questions'),
      modeQuestions: mode === 'chip' && !!activeChip && activeChip.kind === 'questions',
      questionRows: (this.props.questions || []).map((q) => ({ ...q, saveLabel: q.saved ? 'Saved' : 'Save' })),
      savedAny: savedQCount > 0,
      savedLabel: savedQCount === 1 ? '1 question saved to your prep list' : savedQCount + ' questions saved to your prep list',
      onViewPrep: this.props.onViewPrep,
      showRelatedLabel: activeChip ? !!activeChip.showRelatedLabel : false,
      followupButtons:
        mode === 'chip' && activeChip
          ? (activeChip.followups || []).map((f, j) => ({
              text: f.text,
              onClick: () => this.setState({ mode: 'followup', followupIdx: j }),
            }))
          : [],
      hasFollowup: !!activeFollowup,
      followupText: activeFollowup ? activeFollowup.text : '',
      followupResponse: activeFollowup ? activeFollowup.response : '',
      followupHandoff: activeFollowup ? activeFollowup.handoff : '',
      chooseAnother: () => this.setState({ mode: 'default' }),
      backToRelated: () => this.setState({ mode: 'chip' }),
      onClose: this.props.onClose || (() => {}),
    };
  }
}
</script>
</body>
</html>
