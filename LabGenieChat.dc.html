<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;height:100%;background:#fff;font-family:Inter,sans-serif">
  <!-- Header -->
  <div style="flex-shrink:0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #DAE0EE;min-height:56px">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="display:flex;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0;width:28px;height:28px;background:var(--accent,#016ab3)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 2H5C3.9 2 3 2.9 3 4V18C3 19.1 3.9 20 5 20H9L11.29 22.29C11.68 22.68 12.31 22.68 12.7 22.29L15 20H19C20.1 20 21 19.1 21 18V4C21 2.9 20.1 2 19 2ZM13.88 12.88L12 17L10.12 12.88L6 11L10.12 9.12L12 5L13.88 9.12L18 11L13.88 12.88Z" fill="white"></path></svg>
      </div>
      <span style="font-size:18px;font-weight:700;color:#25282A">Ask LabGenie</span>
    </div>
    <sc-if value="{{ showChooseAnother }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ chooseAnother }}" style="background:none;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;margin-left:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--accent,#016ab3)" style-hover="opacity:0.7">Choose another topic →</button>
    </sc-if>
    <sc-if value="{{ showClose }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onClose }}" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;color:#25282A" style-hover="background:#f3f4f6">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </sc-if>
  </div>

  <!-- Content -->
  <div style="flex:1;overflow-y:auto;padding:20px 16px;min-height:0">

    <!-- DEFAULT -->
    <sc-if value="{{ isDefault }}" hint-placeholder-val="{{ true }}">
      <div style="border-radius:12px;padding:16px;margin-bottom:20px;background:#F2F5F8">
        <p style="font-size:15px;font-weight:500;color:#1A1A1A;line-height:22px">{{ greeting }}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ chipButtons }}" as="chip" hint-placeholder-count="4">
          <button onClick="{{ chip.onClick }}" style="width:100%;text-align:left;border-radius:12px;padding:12px 16px;background:#fff;border:1px solid #D6E8F2;cursor:pointer;font-family:Inter,sans-serif;font-size:15px;font-weight:500;color:#25282A;line-height:22px;transition:background .15s,border-color .15s" style-hover="background:#F0F7FA;border-color:#B8DBF0">{{ chip.text }}</button>
        </sc-for>
      </div>
      <p style="text-align:center;margin-top:16px;font-size:13px;font-weight:500;color:#9CA3AF">{{ hint }}</p>
    </sc-if>

    <!-- CHIP / FOLLOWUP -->
    <sc-if value="{{ notDefault }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;border-radius:12px;padding:12px 16px;margin-bottom:12px;background:var(--accent,#016ab3)">
        <span style="font-size:15px;font-weight:500;color:#fff;line-height:22px">{{ activeChipText }}</span>
      </div>
      <div style="border-radius:12px;padding:16px;margin-bottom:16px;background:#F2F5F8">
        <p style="font-size:15px;font-weight:500;color:#1A1A1A;line-height:22px">{{ activeResponse }}</p>
      </div>

      <sc-if value="{{ modeQuestions }}" hint-placeholder-val="{{ false }}">
        <p style="margin-bottom:8px;font-size:13px;font-weight:500;color:#9CA3AF">Tap the bookmark to save a question for your visit:</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ questionRows }}" as="q" hint-placeholder-count="3">
            <div style="{{ q.rowStyle }}" style-hover="{{ q.rowHover }}">
              <span style="flex:1;font-size:15px;font-weight:500;color:#25282A;line-height:22px">{{ q.text }}</span>
              <button onClick="{{ q.toggle }}" style="background:none;border:none;cursor:pointer;flex-shrink:0;display:flex" style-hover="opacity:0.7">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="{{ q.bmFill }}" stroke="var(--accent,#016ab3)" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
              </button>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ modeChip }}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{ showRelatedLabel }}" hint-placeholder-val="{{ false }}">
          <p style="margin-bottom:8px;font-size:13px;font-weight:500;color:#9CA3AF">Related questions:</p>
        </sc-if>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ followupButtons }}" as="fu" hint-placeholder-count="3">
            <button onClick="{{ fu.onClick }}" style="width:100%;text-align:left;border-radius:12px;padding:12px 16px;background:#EBF5FA;border:1px solid #B8DBF0;cursor:pointer;font-family:Inter,sans-serif;font-size:15px;font-weight:500;color:var(--accent,#016ab3);line-height:22px" style-hover="opacity:0.8">{{ fu.text }}</button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ hasFollowup }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;border-radius:12px;padding:12px 16px;margin-bottom:12px;background:var(--accent,#016ab3)">
          <span style="font-size:15px;font-weight:500;color:#fff;line-height:22px">{{ followupText }}</span>
        </div>
        <div style="border-radius:12px;padding:16px;background:#F2F5F8">
          <p style="font-size:15px;font-weight:500;color:#1A1A1A;line-height:22px">{{ followupResponse }}</p>
          <p style="margin-top:12px;font-size:15px;font-weight:500;color:#1A1A1A;line-height:22px;font-style:italic">{{ followupHandoff }}</p>
        </div>
        <button onClick="{{ backToRelated }}" style="display:block;margin-top:12px;background:none;border:none;padding:0;cursor:pointer;font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--accent,#016ab3)" style-hover="opacity:0.7">← Back to related questions</button>
      </sc-if>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:560},&quot;chips&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;text&quot;:&quot;Can you help me understand my results?&quot;,&quot;response&quot;:&quot;Which results would you like me to explain?&quot;,&quot;showRelatedLabel&quot;:true,&quot;followups&quot;:[{&quot;text&quot;:&quot;TSH&quot;,&quot;response&quot;:&quot;Your TSH result of 7.0 mIU/L is higher than the normal range.&quot;,&quot;handoff&quot;:&quot;Your care team will be able to go into more detail at your next visit.&quot;}]}],&quot;tsType&quot;:&quot;any[]&quot;},&quot;questions&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;any[]&quot;},&quot;greeting&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;closeable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { mode: 'default', chipIdx: 0, followupIdx: 0 };

  renderVals() {
    const chips = this.props.chips || [];
    const { mode, chipIdx, followupIdx } = this.state;
    const isDefault = mode === 'default';
    const activeChip = !isDefault ? chips[chipIdx] : null;
    const activeFollowup =
      mode === 'followup' && activeChip ? (activeChip.followups || [])[followupIdx] : null;

    return {
      greeting: this.props.greeting || "Hi, Sam. I'm LabGenie, your lab results companion. How can I help you today?",
      hint: this.props.hint || 'Select a topic above to learn more about your results.',
      isDefault,
      notDefault: !isDefault,
      showClose: isDefault && !!this.props.closeable,
      showChooseAnother: !isDefault,
      chipButtons: isDefault
        ? chips.map((c, i) => ({ text: c.text, onClick: () => this.setState({ mode: 'chip', chipIdx: i }) }))
        : [],
      activeChipText: activeChip ? activeChip.text : '',
      activeResponse: activeChip ? activeChip.response : '',
      modeChip: mode === 'chip' && !(activeChip && activeChip.kind === 'questions'),
      modeQuestions: mode === 'chip' && !!activeChip && activeChip.kind === 'questions',
      questionRows: this.props.questions || [],
      showRelatedLabel: activeChip ? !!activeChip.showRelatedLabel : false,
      followupButtons:
        mode === 'chip' && activeChip
          ? (activeChip.followups || []).map((f, j) => ({
              text: f.text,
              onClick: () => this.setState({ mode: 'followup', followupIdx: j }),
            }))
          : [],
      hasFollowup: !!activeFollowup,
      followupText: activeFollowup ? activeFollowup.text : '',
      followupResponse: activeFollowup ? activeFollowup.response : '',
      followupHandoff: activeFollowup ? activeFollowup.handoff : '',
      chooseAnother: () => this.setState({ mode: 'default' }),
      backToRelated: () => this.setState({ mode: 'chip' }),
      onClose: this.props.onClose || (() => {}),
    };
  }
}
</script>
</body>
</html>
